<!doctype html>
<meta charset="utf-8">
<title>blank recorder</title>
<script>
  // The encoder. Main hands this window the stage as its display source
  // (see src/record.js), so getDisplayMedia here never shows a picker.
  //
  // Frames are pulled off the capture track as macOS delivers them, and each
  // one is painted and handed on at once, so the file holds one frame per
  // captured frame with the capture's own timing. The earlier design painted
  // a <video> of the capture on a setInterval: that timer ran at 62.5 Hz
  // (Chromium truncates 1000/60 to 16 ms) against a 60 Hz source, so about
  // one frame in nine of a scroll was a repeat of the one before.
  //
  // The window's rounded corners come through the capture as black, so the
  // frames go through a canvas: a matte is painted first, then the page is
  // drawn inside the same rounded rectangle the stage clips to.
  let rec = null
  let stream = null
  let reader = null

  recorder.onStart(async ({ fps, bitrate, matte, radius, scale, cssWidth, cssHeight }) => {
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: { ideal: fps, max: fps } },
        audio: false,
        cursor: 'never', surfaceSwitching: 'exclude', selfBrowserSurface: 'exclude'   // a page, not a screencast
      })
      const track = stream.getVideoTracks()[0]

      const canvas = document.createElement('canvas')
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true })
      let W = 0, H = 0, r = 0
      let src = { w: 0, h: 0 }
      // Sized from the first frame rather than track.getSettings(), which can
      // still report the display's size before a frame has arrived. The
      // output is the page at `scale` CSS pixels per pixel, never more than
      // the capture actually has.
      const size = (w, h) => {
        src = { w, h }
        const native = w / cssWidth
        const k = Math.min(scale, native) / native
        W = Math.round(w * k); H = Math.round(h * k)
        canvas.width = W; canvas.height = H
        ctx.imageSmoothingQuality = 'high'   // a clean downsample when k < 1
        r = radius * (W / cssWidth)
      }
      const paint = (img) => {
        ctx.fillStyle = matte
        ctx.fillRect(0, 0, W, H)
        if (r > 0) {
          ctx.save()
          ctx.beginPath()
          ctx.roundRect(0, 0, W, H, r)
          ctx.clip()
          ctx.drawImage(img, 0, 0, W, H)
          ctx.restore()
        } else ctx.drawImage(img, 0, 0, W, H)
      }

      const out = canvas.captureStream(0)
      const outTrack = out.getVideoTracks()[0]
      reader = new MediaStreamTrackProcessor({ track }).readable.getReader()
      ;(async () => {
        for (;;) {
          const { value: frame, done } = await reader.read()
          if (done) break
          if (frame.displayWidth !== src.w || frame.displayHeight !== src.h) size(frame.displayWidth, frame.displayHeight)
          paint(frame)
          frame.close()
          outTrack.requestFrame()
        }
      })().catch((e) => { if (rec && rec.state === 'recording') recorder.failed(String(e && e.message || e)) })

      // Level 5.1: 4.2 tops out around 1080p60, and a 2× 1440×900 stage is
      // well past that. Chrome and QuickTime never minded; stricter decoders do.
      // Bits per pixel held steady: a half-size output gets a quarter of the
      // budget, and never less than a comfortable floor for 60 fps UI.
      const budget = Math.max(8e6, Math.round(bitrate * (cssWidth * scale * cssHeight * scale) / (2880 * 1800)))
      rec = new MediaRecorder(out, { mimeType: 'video/mp4;codecs=avc1.640033', videoBitsPerSecond: budget })
      rec.ondataavailable = (e) => { if (e.data.size) e.data.arrayBuffer().then((b) => recorder.chunk(b)) }
      rec.onerror = (e) => recorder.failed(String(e.error || e))
      rec.onstop = () => {
        reader.cancel().catch(() => {})
        stream.getTracks().forEach((t) => t.stop())
        outTrack.stop()
        setTimeout(() => recorder.done(), 300)   // chunks in flight land first
      }
      track.onended = () => { if (rec && rec.state === 'recording') rec.stop() }   // window went away mid-take
      rec.start(250)
      recorder.started()
    } catch (e) {
      recorder.failed(e && e.message ? e.message : String(e))
    }
  })

  // Stopping has to end the take whatever state we're in. Without this, a stop
  // arriving before the recorder existed did nothing at all, and main went on
  // believing a take was running.
  recorder.onStop(() => {
    if (rec && rec.state === 'recording') { rec.stop(); return }
    if (reader) reader.cancel().catch(() => {})
    if (stream) stream.getTracks().forEach((t) => t.stop())
    recorder.failed('the recorder never started')
  })
</script>
