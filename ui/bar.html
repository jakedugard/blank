<!doctype html>
<meta charset="utf-8">
<title>blank</title>
<style>
  :root {
    /* -apple-system resolves to SF Pro on macOS; the named faces are a belt
       for anything that resolves system-ui differently. */
    --font:-apple-system, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    /* Dark wash over the window's native blur. The blur backdrop can be
       anything up to pure white, so the wash is set for that worst case:
       60% black on white gives the ink 5.1:1 and the dim text 4.6:1 (WCAG
       AA); darker desktops only improve it. Black rather than a warm
       near-black because at 60% the tint would be lost anyway and black
       buys the contrast back. */
    --ink:#f4f2ee; --dim:rgba(255,255,255,.84);
    --bar:rgba(0,0,0,.6); --bar-hot:rgba(20,20,20,.7);
    --rule:rgba(255,255,255,.07); --accent:#ff8a72;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; }
  body {
    font:12px/1.4 var(--font);
    color:var(--ink); -webkit-user-select:none; user-select:none;
    letter-spacing:-0.005em;
  }

  .bar {
    height:100%; background:var(--bar); border-radius:12px;
    box-shadow:inset 0 0 0 1px var(--rule);
    display:flex; align-items:center; gap:8px; padding:0 10px 0 16px;
    transition:border-color .12s, background .12s;
    cursor:grab;                       /* the whole bar moves the rig */
  }
  .bar:active { cursor:grabbing; }
  .bar input { cursor:text; }
  .bar button { cursor:pointer; }
  .bar.hot { background:var(--bar-hot); }

  .field { flex:1; min-width:0; display:flex; align-items:center; gap:7px; }
  input {
    all:unset;                         /* first, or it undoes the flex below */
    flex:1; min-width:0; font:12.5px var(--font);
    color:var(--ink); text-overflow:ellipsis;
  }
  input::placeholder { color:var(--dim); }
  /* With the scroll strip open the field condenses to the page's name and
     gives the room to the settings. Click it to get the address back. */
  .bar.strip .field { flex:0 0 auto; width:150px; }
  .bar.strip .field input { color:var(--dim); }

  .btn {
    all:unset; flex:none; padding:5px 9px; border-radius:7px; cursor:pointer;
    font:12px var(--font); color:var(--dim); white-space:nowrap;
    font-variant-numeric:tabular-nums;   /* readouts shouldn't jitter */
    display:flex; align-items:center; gap:5px;
  }
  .btn:hover { color:var(--ink); }
  input::selection { background:rgba(255,255,255,.22); }
  .btn.over { color:var(--accent); }
  .btn.live { color:var(--accent); }
  .btn[hidden] { display:none; }       /* display:flex above would otherwise win */

  .num { cursor:text; gap:6px; }
  .num svg { cursor:ew-resize; flex:none; }
  .num input {
    all:unset; width:2.4ch; text-align:right; font:12px var(--font);
    color:inherit; font-variant-numeric:tabular-nums; cursor:text;
  }
  .num:focus-within { color:var(--ink); }
  .num .unit { color:inherit; opacity:.7; margin-left:-2px; cursor:ew-resize; }
  #scrollStatus:empty { display:none; }

  /* SF Symbols, straight from the system font: private-use code points in
     -apple-system. Regular weight is the thin cut at this size. */
  .sf { font:400 12px/1 var(--font); flex:none; }

  /* The transport: one button that starts the scroll, then becomes the stop
     and the readout while the page moves. */
  .btn.play { padding:5px 7px; gap:6px; }
  .btn.play .stop, .btn.play.live .go { display:none; }
  .btn.play.live .stop { display:inline; }

  /* Scroll is a word that opens the strip: the transport, the mode and its
     numbers. Lit while open. */
  .btn.toggle.on { color:var(--ink); }
  .strip-ctl { display:contents; }
  .strip-ctl[hidden] { display:none; }
  .rule { flex:none; width:1px; height:14px; background:var(--rule); margin:0 2px; }
  .btn.mode { padding:5px 7px; }
</style>

<div class="bar" id="bar">
  <div class="field">
    <input id="input" spellcheck="false" autocomplete="off"
           placeholder="Drop a file or folder, or paste a URL">
  </div>

  <!-- Scroll opens and closes the strip. Nothing moves until play. -->
  <button class="btn toggle" id="scrollToggle" hidden title="Auto-scroll">Scroll</button>

  <!-- The strip. Play scrolls down, ⌥-click up; while the page moves it's
       the stop, and the status beside it counts down the pre-roll, shows the
       direction, or says paused. Then the mode and a preset, each a word
       that clicks to the next. The numbers behind the preset show only when
       they match no preset (Custom), edited like the radius: type, ↑↓ to
       step, drag the unit to scrub. Right-click for all of it as a menu. -->
  <div class="strip-ctl" id="strip" hidden>
    <button class="btn play" id="play">
      <span class="sf go" aria-hidden="true">&#x100284;</span><span class="sf stop" aria-hidden="true">&#x1006F7;</span><span id="scrollStatus"></span>
    </button>
    <span class="rule"></span>
    <button class="btn mode" id="mode" title="Switch mode">Steady</button>
    <button class="btn mode" id="preset" title="Next preset · right-click to fine-tune">Medium</button>
    <label class="btn num" data-key="speed" title="Speed · ↑↓ to step · drag unit to scrub">
      <input inputmode="numeric" spellcheck="false" autocomplete="off"><span class="unit">px/s</span>
    </label>
    <label class="btn num" data-key="ease" title="Easing ramp · ↑↓ to step · drag unit to scrub">
      <input inputmode="numeric" spellcheck="false" autocomplete="off"><span class="unit">ms</span>
    </label>
    <label class="btn num" data-key="stride" title="Stride, as a share of the screen · ↑↓ to step · drag unit to scrub">
      <input inputmode="numeric" spellcheck="false" autocomplete="off"><span class="unit">% screen</span>
    </label>
    <label class="btn num" data-key="dwell" title="Dwell between flicks · ↑↓ to step · drag unit to scrub">
      <input inputmode="decimal" spellcheck="false" autocomplete="off"><span class="unit">s rest</span>
    </label>
    <label class="btn num" data-key="variation" title="Variation in stride, dwell and glide · ↑↓ to step · drag unit to scrub">
      <input inputmode="numeric" spellcheck="false" autocomplete="off"><span class="unit">% vary</span>
    </label>
  </div>

  <button class="btn" id="size">— × —</button>
  <!-- Corner radius is a number, so it's edited as one: click to type,
       drag the icon to scrub, ↑↓ to step (⇧ for tens). -->
  <label class="btn num" id="radius" title="Corner radius · drag icon to scrub · ↑↓ to step">
    <svg id="radiusGrip" width="11" height="11" viewBox="0 0 11 11" aria-hidden="true">
      <path d="M10.5 0.5 H4.5 A4 4 0 0 0 0.5 4.5 V10.5"
            fill="none" stroke="currentColor" stroke-width="1.2"/>
    </svg><input id="radiusIn" inputmode="numeric" spellcheck="false" autocomplete="off" value="0">
  </label>
  <button class="btn more" id="more" title="More"><span class="sf" aria-hidden="true">&#x100360;</span></button>
</div>

<script>
  const $ = (id) => document.getElementById(id)
  const barEl = $('bar'), input = $('input')
  let state = null
  let customMode = null        // 'size' | 'scroll:<key>' while the input captures a value
  let editing = false
  let strip = false            // the scroll strip is open
  let stripFor = null          // ...for this target id

  const back = () => stage.focusStage()

  function resetInput () {
    customMode = null
    input.placeholder = 'Drop a file or folder, or paste a URL'
  }

  // --- drag: anywhere on the bar that isn't a control -----------------------
  barEl.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return
    if (e.target.closest('input, button, label')) return   // let controls be controls

    e.preventDefault()
    barEl.setPointerCapture(e.pointerId)
    const ox = e.screenX, oy = e.screenY
    stage.dragStart()

    const move = (ev) => stage.dragMove(ev.screenX - ox, ev.screenY - oy)
    const up = () => {
      barEl.removeEventListener('pointermove', move)
      barEl.removeEventListener('pointerup', up)
      barEl.removeEventListener('pointercancel', up)
      stage.dragEnd()
    }
    barEl.addEventListener('pointermove', move)
    barEl.addEventListener('pointerup', up)
    barEl.addEventListener('pointercancel', up)
  })

  // --- the one way in: type a path, paste a URL, or drop a file -------------
  input.addEventListener('focus', () => { editing = true; setStrip(false); input.select() })
  input.addEventListener('blur',  () => { editing = false; resetInput(); render(state) })

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { resetInput(); input.blur(); back(); return }
    if (e.key !== 'Enter') return

    const v = input.value.trim()
    if (!v) return

    if (customMode === 'size') {
      const m = v.match(/(\d{2,5})\s*[x×,\s]\s*(\d{2,5})/)
      if (m) stage.setSize({ w: +m[1], h: +m[2] })
    } else if (customMode && customMode.startsWith('scroll:')) {
      const key = customMode.slice(7)
      let n = parseFloat(v)
      // Seconds and percentages are friendlier to type than ms and fractions.
      if (key === 'preroll' || key === 'dwell') n *= 1000
      if ((key === 'stride' || key === 'variation') && (n > 3 || /%/.test(v))) n /= 100
      if (Number.isFinite(n)) stage.setScroll({ [key]: n })
    } else if (/^(\/|~|\.\/)/.test(v)) {
      stage.openPath(v)
    } else {
      stage.openUrl(v)
    }
    resetInput()
    input.blur()
  })

  // --- drop anywhere on the bar --------------------------------------------
  const stop = (e) => { e.preventDefault(); e.stopPropagation() }
  document.addEventListener('dragover',  (e) => { stop(e); barEl.classList.add('hot') })
  document.addEventListener('dragleave', (e) => { stop(e); barEl.classList.remove('hot') })
  document.addEventListener('drop', (e) => {
    stop(e)
    barEl.classList.remove('hot')
    const f = e.dataTransfer.files[0]
    if (f) { const p = stage.pathForFile(f); if (p) stage.openPath(p) }
  })

  // --- inline numbers -------------------------------------------------------
  // One idiom for every number in the bar: type it, ↑↓ to step (⇧ for a
  // bigger step), drag the grip to scrub. `show` maps the stored value to
  // what's typed and `read` maps it back; `commit` sends it home.
  function numberControl ({ root, grip, min, max, step, bigStep, scrub, show, read, commit, current }) {
    const field = root.querySelector('input')
    let pending = 0
    const set = (v) => {
      v = Math.max(min, Math.min(max, v))
      field.value = show(v)
      cancelAnimationFrame(pending)
      pending = requestAnimationFrame(() => commit(v))
    }
    const value = () => { const n = read(parseFloat(field.value)); return Number.isFinite(n) ? n : current() }
    field.addEventListener('focus', () => { editing = true; field.select() })
    field.addEventListener('blur', () => { editing = false; set(value()) })
    field.addEventListener('keydown', (e) => {
      const inc = e.shiftKey ? bigStep : step
      if (e.key === 'ArrowUp') { e.preventDefault(); set(value() + inc) }
      else if (e.key === 'ArrowDown') { e.preventDefault(); set(value() - inc) }
      else if (e.key === 'Enter') { set(value()); field.blur(); back() }
      else if (e.key === 'Escape') { field.value = show(current()); field.blur(); back() }
    })
    grip.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return
      e.preventDefault()
      e.stopPropagation()                     // not a bar drag
      grip.setPointerCapture(e.pointerId)
      const ox = e.screenX
      const base = value()
      const move = (ev) => set(base + (ev.screenX - ox) * scrub)
      const up = () => {
        grip.removeEventListener('pointermove', move)
        grip.removeEventListener('pointerup', up)
        grip.removeEventListener('pointercancel', up)
      }
      grip.addEventListener('pointermove', move)
      grip.addEventListener('pointerup', up)
      grip.addEventListener('pointercancel', up)
    })
    return { field, sync: () => { if (document.activeElement !== field) field.value = show(current()) } }
  }

  const round = (v, d = 0) => { const f = 10 ** d; return Math.round(v * f) / f }
  const scrollNow = (k) => (state && state.scroll) ? state.scroll[k] : 0

  // --- corner radius ---
  const radius = numberControl({
    root: $('radius'), grip: $('radiusGrip'), min: 0, max: 120, step: 1, bigStep: 10, scrub: 0.5,
    show: (v) => Math.round(v), read: (n) => n,
    commit: (v) => stage.setRadius(Math.round(v)),
    current: () => state ? state.radius : 0
  })

  // --- the scroll strip's numbers ---
  // Stored units are px/s, ms, fraction, ms, fraction; shown as px/s, ms, %, s, %.
  const SPEC = {
    speed:     { min: 5, max: 2000, step: 10, bigStep: 50, scrub: 2, show: (v) => Math.round(v), read: (n) => n },
    ease:      { min: 0, max: 10000, step: 100, bigStep: 500, scrub: 5, show: (v) => Math.round(v), read: (n) => n },
    stride:    { min: 0.1, max: 3, step: 0.05, bigStep: 0.25, scrub: 0.005, show: (v) => Math.round(v * 100), read: (n) => n / 100 },
    dwell:     { min: 0, max: 30000, step: 100, bigStep: 500, scrub: 10, show: (v) => round(v / 1000, 1), read: (n) => n * 1000 },
    variation: { min: 0, max: 1, step: 0.05, bigStep: 0.25, scrub: 0.005, show: (v) => Math.round(v * 100), read: (n) => n / 100 }
  }
  const BY_MODE = { steady: ['speed', 'ease'], natural: ['stride', 'dwell', 'variation'] }
  const nums = {}
  for (const root of document.querySelectorAll('#strip .num')) {
    const key = root.dataset.key
    nums[key] = numberControl({
      root, grip: root.querySelector('.unit'), ...SPEC[key],
      commit: (v) => stage.setScroll({ [key]: v }),
      current: () => scrollNow(key)
    })
  }

  // --- auto-scroll transport -------------------------------------------------
  const play = $('play')
  play.onclick = (e) => {
    const live = !!(state && state.scrolling && state.scrolling.active)
    if (live) stage.scrollStop()
    else stage.scroll(e.altKey ? -1 : 1)
    back()
  }
  $('mode').onclick = () => stage.setScroll({ mode: scrollNow('mode') === 'natural' ? 'steady' : 'natural' })
  $('preset').onclick = () => stage.scrollPreset()
  // Pre-roll, the locked rhythm and custom entry stay one right-click away.
  for (const el of [$('scrollToggle'), $('strip')]) {
    el.addEventListener('contextmenu', (e) => { e.preventDefault(); stage.scrollMenu() })
  }

  $('scrollToggle').onclick = () => { setStrip(!strip); back() }

  // The strip stays open until you fold it or go back to the address, so
  // you can tune, stop and go again without it moving.
  function setStrip (on) {
    strip = on
    stripFor = on && state && state.target ? state.target.id : null
    render(state)
  }

  $('size').onclick = () => stage.sizeMenu()
  $('more').onclick = () => stage.moreMenu()

  stage.onFocusInput(() => input.focus())
  stage.onCustomSize(() => askFor('size', 'Custom size — e.g. 1512 × 982'))
  stage.onCustomScroll((key) => askFor('scroll:' + key, {
    speed: 'Scroll speed in px/s — e.g. 120',
    ease: 'Easing ramp in ms — e.g. 600',
    preroll: 'Pre-roll in seconds — e.g. 2',
    stride: 'Stride as a share of the screen — e.g. 0.5',
    dwell: 'Dwell between flicks in seconds — e.g. 1.5',
    variation: 'Variation, 0 to 1 — e.g. 0.3'
  }[key]))

  function askFor (mode, placeholder) {
    customMode = mode
    input.value = ''
    input.placeholder = placeholder
    input.focus()
  }

  // --- render ---------------------------------------------------------------
  stage.onState((s) => {
    state = s
    // A keyboard start opens the strip too; a new page closes it.
    const live = !!(s && s.scrolling && s.scrolling.active)
    if (live && !strip) { strip = true; stripFor = s.target && s.target.id }
    if (strip && (!s.target || s.target.id !== stripFor)) { strip = false; stripFor = null }
    render(s)
  })

  function render (s) {
    if (!s) return
    const t = s.target
    const showStrip = strip && !!t && s.features.scroll

    barEl.classList.toggle('strip', showStrip)
    if (!editing && !customMode) {
      input.value = t ? (showStrip ? (t.name || t.url || '') : (t.url || '')) : ''
    }

    $('radius').hidden = !s.features.radius || !s.target   // nothing to round yet
    radius.sync()
    renderScroll(s, showStrip)

    const size = $('size')
    size.hidden = !s.size
    if (s.size) {
      size.textContent = `${s.size.w} × ${s.size.h}`
      const over = s.size.w > s.maxFit.w || s.size.h > s.maxFit.h
      size.classList.toggle('over', over)
      size.title = over
        ? `Exceeds this display (${s.maxFit.w} × ${s.maxFit.h}) — a screen recording will clip it`
        : 'Change size'
    }

    fitBar()
  }

  // While the page moves, the transport becomes the stop and the readout:
  // a status counts down the pre-roll, shows the direction, or says paused.
  let countdown = null
  function renderScroll (s, showStrip) {
    const st = s.scrolling
    const sc = s.scroll
    clearInterval(countdown)
    const hidden = !s.features.scroll || !s.target || !sc
    const live = !!(st && st.active)
    const toggle = $('scrollToggle')
    toggle.hidden = hidden
    toggle.classList.toggle('on', showStrip)
    $('strip').hidden = hidden || !showStrip
    if (hidden) return

    play.classList.toggle('live', live)
    const modeName = sc.mode === 'natural' ? 'Natural' : 'Steady'
    play.title = `${modeName} scroll down · ⌥-click scrolls up · ⌥↓ ⌥↑ · hold P to pause · esc stops`
    toggle.title = showStrip ? 'Close the scroll strip · right-click for pre-roll and more' : 'Auto-scroll'

    const mode = $('mode')
    mode.textContent = modeName
    mode.title = `Switch to ${sc.mode === 'natural' ? 'Steady' : 'Natural'}`
    $('preset').textContent = sc.preset || 'Custom'
    const keys = sc.preset === 'Custom' ? (BY_MODE[sc.mode] || BY_MODE.steady) : []
    for (const [key, n] of Object.entries(nums)) {
      n.field.closest('.num').hidden = !keys.includes(key)
      n.sync()
    }

    const status = $('scrollStatus')
    const arrow = live ? (st.dir < 0 ? '↑' : '↓') : ''
    if (live && st.phase === 'preroll') {
      const tickDown = () => {
        const left = Math.max(0, st.until - Date.now())
        status.textContent = `${arrow} in ${(left / 1000).toFixed(1)} s`
      }
      tickDown()
      countdown = setInterval(tickDown, 100)
    } else if (live && st.phase === 'paused') {
      status.textContent = `${arrow} paused`
    } else {
      status.textContent = arrow
    }
  }

  // The window grows to fit the strip and shrinks back without it. Widths
  // are summed from the controls rather than measured off the bar, since the
  // bar always fills whatever window it's given.
  let fitted = 0
  function fitBar () {
    let want = 0
    if (barEl.classList.contains('strip')) {
      const cs = getComputedStyle(barEl)
      want = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)
      let n = 0
      const add = (el) => { if (el.hidden || el.offsetParent === null) return; want += el.getBoundingClientRect().width; n++ }
      for (const el of barEl.children) {
        if (el.id === 'strip') { for (const c of el.children) add(c) } else add(el)
      }
      want += parseFloat(cs.columnGap) * Math.max(0, n - 1)
      want = Math.ceil(want) + 2
    }
    if (want !== fitted) { fitted = want; stage.setBarWidth(want) }   // 0 = back to the base width
  }
</script>
