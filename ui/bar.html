<!doctype html>
<meta charset="utf-8">
<title>blank</title>
<style>
  :root {
    /* -apple-system resolves to SF Pro on macOS; the named faces are a belt
       for anything that resolves system-ui differently. */
    --font:-apple-system, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    /* Dark wash over the window's native blur. The blur backdrop can be
       anything up to pure white, so the wash is set for that worst case:
       60% black on white gives the ink 5.1:1 and the dim text 4.6:1 (WCAG
       AA); darker desktops only improve it. Black rather than a warm
       near-black because at 60% the tint would be lost anyway and black
       buys the contrast back. */
    --ink:#f4f2ee; --dim:rgba(255,255,255,.84);
    --bar:rgba(0,0,0,.6); --bar-hot:rgba(20,20,20,.7);
    --rule:rgba(255,255,255,.07); --accent:#ff8a72;
    --well:rgba(255,255,255,.06); --hover:rgba(255,255,255,.09); --pill:rgba(255,255,255,.14);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; }
  body {
    font:12px/1.4 var(--font);
    color:var(--ink); -webkit-user-select:none; user-select:none;
    letter-spacing:-0.005em;
  }

  .bar {
    height:100%; background:var(--bar); border-radius:12px;
    box-shadow:inset 0 0 0 1px var(--rule);
    display:flex; align-items:center; gap:8px; padding:0 10px 0 16px;
    transition:border-color .12s, background .12s;
    cursor:grab;                       /* the whole bar moves the rig */
  }
  .bar:active { cursor:grabbing; }
  .bar input { cursor:text; }
  .bar button { cursor:pointer; }
  .bar.hot { background:var(--bar-hot); }

  .field { flex:1; min-width:0; display:flex; align-items:center; gap:7px; }
  input {
    all:unset;                         /* first, or it undoes the flex below */
    flex:1; min-width:0; font:12.5px var(--font);
    color:var(--ink); text-overflow:ellipsis;
  }
  input::placeholder { color:var(--dim); }

  .btn {
    all:unset; flex:none; padding:5px 9px; border-radius:7px; cursor:pointer;
    font:12px var(--font); color:var(--dim); white-space:nowrap;
    font-variant-numeric:tabular-nums;   /* readouts shouldn't jitter */
    display:flex; align-items:center; gap:5px;
  }
  .btn:hover { color:var(--ink); }
  input::selection { background:rgba(255,255,255,.22); }
  .btn.over { color:var(--accent); }
  .btn[hidden] { display:none; }       /* display:flex above would otherwise win */

  .num { cursor:text; gap:6px; }
  .num svg { cursor:ew-resize; flex:none; }
  .num input {
    all:unset; width:2.4ch; text-align:right; font:12px var(--font);
    color:inherit; font-variant-numeric:tabular-nums; cursor:text;
  }
  .num:focus-within { color:var(--ink); }
  .num .unit { color:inherit; opacity:.7; margin-left:-2px; cursor:ew-resize; }

  /* SF Symbols, straight from the system font: private-use code points in
     -apple-system. Regular weight is the thin cut at this size. */
  .sf { font:400 12px/1 var(--font); flex:none; }

  /* Groups. Each category is a well with its options inside; the active
     option is the filled pill. The label, where there is one, is the
     quietest thing in the well. A well with nothing showing hides itself. */
  .group {
    display:flex; align-items:center; gap:2px; flex:none;
    padding:3px; border-radius:9px; background:var(--well);
  }
  .group[hidden], .group:not(:has(> .btn:not([hidden]))) { display:none; }
  .group .btn { padding:4px 8px; border-radius:6px; }
  .group .btn:hover { background:var(--hover); color:var(--ink); }
  .group .btn.on { background:var(--pill); color:var(--ink); }
  /* The label is a button in every respect but the click, so it sits on
     the same line as its neighbours. */
  .group .label {
    all:unset; display:flex; align-items:center; flex:none;
    padding:4px 5px 4px 7px; font:12px var(--font); color:var(--dim); opacity:.55; cursor:default;
  }

  /* Record. A dot and a word; while a take runs the pill fills, lit, and
     the word becomes the clock. The outcome shows for a moment after. */
  .btn.rec .dot { width:8px; height:8px; border-radius:50%; background:currentColor; flex:none; }
  .btn.rec.on { background:var(--pill); color:var(--accent); }
  .btn.rec.on:hover { color:var(--ink); }
  .btn.rec.done { color:var(--ink); }

  /* Scroll. Steady or Natural selects; the play at the end of the well
     goes. While the page moves the play is the stop, lit, with the readout
     inside it. The presets well opens beside it for the selected mode. */
  .btn.play .stop, .btn.play .status { display:none; }
  .btn.play.live { background:var(--pill); color:var(--accent); }
  .btn.play.live .go { display:none; }
  .btn.play.live .stop, .btn.play.live .status { display:inline; }
  .btn.play.live:hover { color:var(--ink); }

  /* Back to the top. No well: the arrow is the whole control, and it fades
     rather than appears. It keeps its slot in the layout either way, so
     passing a quarter of the page doesn't resize the rig and shunt it
     sideways. */
  .top { flex:none; display:flex; align-items:center;
    opacity:1; transition:opacity .18s ease; }
  .top.ghost { opacity:0; pointer-events:none; }
  #topBtn { font:13px/1 var(--font); padding:5px 7px; }

  /* Pins. Armed, the pill is lit like a running take, because the page is
     inert underneath it and that has to be obvious. */
  #pinsBtn.on { background:var(--pill); color:var(--accent); }
  #pinsBtn.on:hover { color:var(--ink); }
  /* Zap lights the same way, for the same reason. */
  #zapBtn.on { background:var(--pill); color:var(--accent); }
  #zapBtn.on:hover { color:var(--ink); }
</style>

<div class="bar" id="bar">
  <div class="field">
    <input id="input" spellcheck="false" autocomplete="off"
           placeholder="Drop a file or folder, or paste a URL">
  </div>

  <!-- Back to the top of the page, once you're far enough down to want it.
       It lives in the bar rather than over the page because the bar is the
       part macOS leaves out of a capture. -->
  <div class="top" id="topWell" hidden>
    <button class="btn" id="topBtn">↑</button>
  </div>

  <!-- Auto-scroll. Steady or Natural selects the mode and opens the play
       and the presets; the same word again folds them. Play scrolls down,
       ⌥-click up. While it runs, play is the stop with the readout: the
       pre-roll countdown, the direction, or paused. Right-click the group
       for the numbers, pre-roll and the rest. -->
  <div class="group scroll" id="scroll" hidden>
    <span class="label" title="Auto-scroll · right-click to fine-tune">Scroll</span>
    <button class="btn" data-mode="steady" title="One speed, start to finish">Steady</button>
    <button class="btn" data-mode="natural" title="A flick, a rest, a flick">Natural</button>
    <button class="btn" data-mode="pin" title="Travel to each pin and hold there">Pin</button>
    <button class="btn play" id="play" hidden title="Scroll down · ⌥-click scrolls up · ⌥↓ ⌥↑ · hold P to pause · esc stops">
      <span class="sf go" aria-hidden="true">&#x100284;</span><span class="sf stop" aria-hidden="true">&#x1006F7;</span><span class="status" id="scrollStatus"></span>
    </button>
  </div>
  <div class="group" id="presets" hidden></div>

  <!-- Pins. In Pin mode the page travels a screen at a time and rests only on
       these: each one comes to a stop in the middle of the frame and holds.
       Arm this and the page goes inert — click a spot to pin it, click a dot
       to take it away. Right-click the well to clear them. -->
  <div class="group" id="pinsWell" hidden>
    <button class="btn" id="pinsBtn" title="Click spots on the page to pin where a take rests">Pins</button>
    <button class="btn" id="pinsClear" hidden title="Take every pin off this page">Clear</button>
  </div>

  <!-- The numbers behind a preset, for Custom. Each is edited like the
       radius: type, ↑↓ to step, drag the unit to scrub. Which show depends
       on the mode; a running scroll picks changes up live. -->
  <div class="group" id="numbers" hidden>
    <label class="btn num" data-key="speed" title="Speed · ↑↓ to step · drag unit to scrub"><input inputmode="numeric" spellcheck="false" autocomplete="off"><span class="unit">px/s</span></label>
    <label class="btn num" data-key="ease" title="Easing ramp · ↑↓ to step · drag unit to scrub"><input inputmode="numeric" spellcheck="false" autocomplete="off"><span class="unit">ms ease</span></label>
    <label class="btn num" data-key="stride" title="Stride, as a share of the screen · ↑↓ to step · drag unit to scrub"><input inputmode="numeric" spellcheck="false" autocomplete="off"><span class="unit">% screen</span></label>
    <label class="btn num" data-key="dwell" title="Dwell between flicks · ↑↓ to step · drag unit to scrub"><input inputmode="decimal" spellcheck="false" autocomplete="off"><span class="unit">s rest</span></label>
    <label class="btn num" data-key="variation" title="Variation in stride, dwell and glide · ↑↓ to step · drag unit to scrub"><input inputmode="numeric" spellcheck="false" autocomplete="off"><span class="unit">% vary</span></label>
    <label class="btn num" data-key="pace" title="Glide: how quick the hand is, as a share of the easy pace · ↑↓ to step · drag unit to scrub"><input inputmode="numeric" spellcheck="false" autocomplete="off"><span class="unit">% glide</span></label>
    <label class="btn num" data-key="hold" title="Hold at a pin · ↑↓ to step · drag unit to scrub"><input inputmode="decimal" spellcheck="false" autocomplete="off"><span class="unit">s hold</span></label>
    <label class="btn num" data-key="travel" title="What a screen's worth of travel costs · ↑↓ to step · drag unit to scrub"><input inputmode="decimal" spellcheck="false" autocomplete="off"><span class="unit">s a screen</span></label>
  </div>

  <!-- Zap. Arm it and the page goes inert: click anything that shouldn't be
       in the take — a cookie banner, a chat bubble — and it's gone, for this
       target, on every load. Right-click to restore. -->
  <div class="group" id="zapWell" hidden>
    <button class="btn" id="zapBtn" title="Click elements on the page to keep them out of the take · right-click to restore">Zap</button>
  </div>

  <!-- Record. With a scroll mode selected it runs the whole take: record,
       scroll to the end, settle, stop, reveal the file. Otherwise it records
       until pressed again. The page's cursor is hidden for the take. -->
  <div class="group" id="record" hidden>
    <button class="btn rec" id="recBtn" title="Record the page · ⌘⇧R"><span class="dot"></span><span class="word">Record</span></button>
  </div>

  <div class="group" id="sizeWell">
    <button class="btn" id="size">— × —</button>
    <!-- Custom size: the two numbers, inline, until return or escape. -->
    <label class="btn num" id="sizeW" hidden title="Width · ↑↓ to step"><input inputmode="numeric" spellcheck="false" autocomplete="off"><span class="unit">×</span></label>
    <label class="btn num" id="sizeH" hidden title="Height · ↑↓ to step"><input inputmode="numeric" spellcheck="false" autocomplete="off"><span class="unit">px</span></label>
  </div>
  <!-- The system colour panel, for a custom matte. -->
  <input type="color" id="matteIn" style="position:absolute;left:-100px;top:-100px;width:1px;height:1px;opacity:0" tabindex="-1">
  <!-- Corner radius is a number, so it's edited as one: click to type,
       drag the icon to scrub, ↑↓ to step (⇧ for tens). -->
  <div class="group">
    <label class="btn num" id="radius" title="Corner radius · drag icon to scrub · ↑↓ to step">
      <svg id="radiusGrip" width="11" height="11" viewBox="0 0 11 11" aria-hidden="true">
        <path d="M10.5 0.5 H4.5 A4 4 0 0 0 0.5 4.5 V10.5"
              fill="none" stroke="currentColor" stroke-width="1.2"/>
      </svg><input id="radiusIn" inputmode="numeric" spellcheck="false" autocomplete="off" value="0">
    </label>
  </div>
  <button class="btn more" id="more" title="More"><span class="sf" aria-hidden="true">&#x100360;</span></button>
</div>

<script>
  const $ = (id) => document.getElementById(id)
  const barEl = $('bar'), input = $('input')
  let state = null
  let editing = false
  let armed = null             // target id whose scroll well is open
  let numbersFor = null        // target id whose numbers well is open (Custom)

  const back = () => stage.focusStage()


  // --- drag: anywhere on the bar that isn't a control -----------------------
  barEl.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return
    if (e.target.closest('input, button, label')) return   // let controls be controls

    e.preventDefault()
    barEl.setPointerCapture(e.pointerId)
    const ox = e.screenX, oy = e.screenY
    stage.dragStart()

    const move = (ev) => stage.dragMove(ev.screenX - ox, ev.screenY - oy)
    const up = () => {
      barEl.removeEventListener('pointermove', move)
      barEl.removeEventListener('pointerup', up)
      barEl.removeEventListener('pointercancel', up)
      stage.dragEnd()
    }
    barEl.addEventListener('pointermove', move)
    barEl.addEventListener('pointerup', up)
    barEl.addEventListener('pointercancel', up)
  })

  // --- the one way in: type a path, paste a URL, or drop a file -------------
  input.addEventListener('focus', () => { editing = true; input.select() })
  input.addEventListener('blur',  () => { editing = false; render(state) })

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { input.blur(); back(); return }
    if (e.key !== 'Enter') return
    const v = input.value.trim()
    if (!v) return
    if (/^(\/|~|\.\/)/.test(v)) stage.openPath(v)
    else stage.openUrl(v)
    input.blur()
  })

  // --- drop anywhere on the bar --------------------------------------------
  const stop = (e) => { e.preventDefault(); e.stopPropagation() }
  document.addEventListener('dragover',  (e) => { stop(e); barEl.classList.add('hot') })
  document.addEventListener('dragleave', (e) => { stop(e); barEl.classList.remove('hot') })
  document.addEventListener('drop', (e) => {
    stop(e)
    barEl.classList.remove('hot')
    const f = e.dataTransfer.files[0]
    if (f) { const p = stage.pathForFile(f); if (p) stage.openPath(p) }
  })

  // --- inline numbers -------------------------------------------------------
  // One idiom for every number in the bar: type it, ↑↓ to step (⇧ for a
  // bigger step), drag the grip to scrub. `show` maps the stored value to
  // what's typed and `read` maps it back; `commit` sends it home.
  function numberControl ({ root, grip, min, max, step, bigStep, scrub, show, read, commit, current }) {
    const field = root.querySelector('input')
    let pending = 0
    const set = (v) => {
      v = Math.max(min, Math.min(max, v))
      field.value = show(v)
      cancelAnimationFrame(pending)
      pending = requestAnimationFrame(() => commit(v))
    }
    const value = () => { const n = read(parseFloat(field.value)); return Number.isFinite(n) ? n : current() }
    field.addEventListener('focus', () => { editing = true; field.select() })
    field.addEventListener('blur', () => { editing = false; set(value()) })
    field.addEventListener('keydown', (e) => {
      const inc = e.shiftKey ? bigStep : step
      if (e.key === 'ArrowUp') { e.preventDefault(); set(value() + inc) }
      else if (e.key === 'ArrowDown') { e.preventDefault(); set(value() - inc) }
      else if (e.key === 'Enter') { set(value()); field.blur(); back() }
      else if (e.key === 'Escape') { field.value = show(current()); field.blur(); back() }
    })
    grip.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return
      e.preventDefault()
      e.stopPropagation()                     // not a bar drag
      grip.setPointerCapture(e.pointerId)
      const ox = e.screenX
      const base = value()
      const move = (ev) => set(base + (ev.screenX - ox) * scrub)
      const up = () => {
        grip.removeEventListener('pointermove', move)
        grip.removeEventListener('pointerup', up)
        grip.removeEventListener('pointercancel', up)
      }
      grip.addEventListener('pointermove', move)
      grip.addEventListener('pointerup', up)
      grip.addEventListener('pointercancel', up)
    })
    return { field, sync: () => { if (document.activeElement !== field) field.value = show(current()) } }
  }

  const round = (v, d = 0) => { const f = 10 ** d; return Math.round(v * f) / f }
  const scrollNow = (k) => (state && state.scroll) ? state.scroll[k] : null

  // --- corner radius ---
  const radius = numberControl({
    root: $('radius'), grip: $('radiusGrip'), min: 0, max: 120, step: 1, bigStep: 10, scrub: 0.5,
    show: (v) => Math.round(v), read: (n) => n,
    commit: (v) => stage.setRadius(Math.round(v)),
    current: () => state ? state.radius : 0
  })

  // --- the numbers behind a preset ---
  // Stored units are px/s, ms, fraction, ms, fraction, factor; shown as
  // px/s, ms, %, s, %, %.
  const SPEC = {
    speed:     { min: 5, max: 2000, step: 10, bigStep: 50, scrub: 2, show: (v) => Math.round(v), read: (n) => n },
    ease:      { min: 0, max: 10000, step: 100, bigStep: 500, scrub: 5, show: (v) => Math.round(v), read: (n) => n },
    stride:    { min: 0.1, max: 3, step: 0.05, bigStep: 0.25, scrub: 0.005, show: (v) => Math.round(v * 100), read: (n) => n / 100 },
    dwell:     { min: 0, max: 30000, step: 100, bigStep: 500, scrub: 10, show: (v) => round(v / 1000, 2), read: (n) => n * 1000 },
    hold:      { min: 0, max: 30000, step: 100, bigStep: 500, scrub: 10, show: (v) => round(v / 1000, 2), read: (n) => n * 1000 },
    travel:    { min: 150, max: 5000, step: 50, bigStep: 250, scrub: 5, show: (v) => round(v / 1000, 2), read: (n) => n * 1000 },
    variation: { min: 0, max: 1, step: 0.05, bigStep: 0.25, scrub: 0.005, show: (v) => Math.round(v * 100), read: (n) => n / 100 },
    pace:      { min: 0.3, max: 2, step: 0.05, bigStep: 0.25, scrub: 0.005, show: (v) => Math.round(v * 100), read: (n) => n / 100 }
  }
  const BY_MODE = {
    steady: ['speed', 'ease'],
    natural: ['stride', 'dwell', 'variation', 'pace'],
    pin: ['hold', 'travel']
  }
  const numbers = $('numbers')
  const nums = {}
  for (const root of numbers.querySelectorAll('.num')) {
    const key = root.dataset.key
    nums[key] = numberControl({
      root, grip: root.querySelector('.unit'), ...SPEC[key],
      commit: (v) => stage.setScroll({ [key]: v }),
      current: () => scrollNow(key) || 0
    })
  }

  // --- custom size: two inline numbers ---
  const sizeW = $('sizeW'), sizeH = $('sizeH')
  const sizeNum = (root, k) => numberControl({
    root, grip: root.querySelector('.unit'), min: 100, max: 8000, step: 1, bigStep: 10, scrub: 1,
    show: (v) => Math.round(v), read: (n) => n,
    commit: () => stage.setSize({ w: parseInt(sizeW.querySelector('input').value, 10), h: parseInt(sizeH.querySelector('input').value, 10) }),
    current: () => (state && state.size) ? state.size[k] : 0
  })
  sizeNum(sizeW, 'w'); sizeNum(sizeH, 'h')
  let sizing = false
  function editSize (on) {
    sizing = on
    sizeW.hidden = sizeH.hidden = !on
    $('size').hidden = on || !(state && state.size)
    if (on) {
      sizeW.querySelector('input').value = state.size.w
      sizeH.querySelector('input').value = state.size.h
      sizeW.querySelector('input').focus()
    }
    fitBar()
  }
  for (const el of [sizeW, sizeH]) {
    el.querySelector('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') setTimeout(() => editSize(false), 0)
    })
  }
  $('sizeWell').addEventListener('focusout', () => setTimeout(() => { if (sizing && !$('sizeWell').contains(document.activeElement)) editSize(false) }, 0))

  // --- matte: the system colour panel ---
  const matteIn = $('matteIn')
  matteIn.addEventListener('input', () => stage.setMatte(matteIn.value))

  // --- auto-scroll ------------------------------------------------------------
  const scroll = $('scroll')
  const play = $('play')
  const presets = $('presets')
  const modeBtns = [...scroll.querySelectorAll('[data-mode]')]
  const isArmed = () => !!(state && state.target && armed === state.target.id)
  for (const b of modeBtns) {
    b.onclick = () => {
      const mode = b.dataset.mode
      if (isArmed() && scrollNow('mode') === mode) { armed = null; numbersFor = null; render(state); return }
      armed = state.target.id
      if (scrollNow('mode') !== mode) stage.setScroll({ mode }); else render(state)
      if (mode === 'pin') stage.pins('on')
      back()
    }
  }
  play.onclick = (e) => {
    const live = !!(state && state.scrolling && state.scrolling.active)
    if (live) stage.scrollStop()
    else stage.scroll(e.altKey ? -1 : 1)
    back()
  }
  for (const el of [scroll, presets, $('pinsWell')]) {
    el.addEventListener('contextmenu', (e) => { e.preventDefault(); stage.scrollMenu() })
  }

  // --- pins ------------------------------------------------------------------
  $('pinsBtn').onclick = () => { stage.pins('toggle'); back() }
  // Starting over shouldn't mean walking down the page unpicking every one.
  $('pinsClear').onclick = () => { stage.pins('clear'); back() }

  // --- zap -------------------------------------------------------------------
  $('zapBtn').onclick = () => { stage.zaps('toggle'); back() }
  $('zapWell').addEventListener('contextmenu', (e) => { e.preventDefault(); stage.zapMenu() })

  // --- back to the top --------------------------------------------------------
  $('topBtn').onclick = () => { stage.toTop(); back() }

  // --- record -----------------------------------------------------------------
  const recBtn = $('recBtn')
  recBtn.onclick = () => {
    const r = state && state.recording
    if (r && r.phase === 'failed' && state.recordPermission !== 'granted') { stage.recordPermission(); return }
    stage.record({ withScroll: isArmed() })
    back()
  }

  $('size').onclick = () => stage.sizeMenu()
  $('more').onclick = () => stage.moreMenu()

  stage.onFocusInput(() => input.focus())
  stage.onCustomSize(() => { if (state && state.size) editSize(true) })
  stage.onCustomMatte(() => { matteIn.value = (state && state.matte) || '#ffffff'; matteIn.click() })

  // --- render ---------------------------------------------------------------
  stage.onState((s) => {
    state = s
    // A keyboard start opens the well too, so the readout has somewhere to be,
    // and so does pinning from the menu: the pill is how you get back out.
    if (s && s.target && s.scrolling && s.scrolling.active) armed = s.target.id
    if (s && s.target && s.pins && s.pins.pinning) armed = s.target.id
    render(s)
  })

  function render (s) {
    if (!s) return
    const t = s.target

    if (!editing) input.value = t ? (t.url || '') : ''

    $('topWell').hidden = !s.target        // nothing to be at the top of
    $('topWell').classList.toggle('ghost', !s.deep)

    $('radius').hidden = !s.features.radius || !s.target   // nothing to round yet; its well hides with it
    radius.sync()
    renderScroll(s)
    renderZap(s)
    renderRecord(s)

    const size = $('size')
    size.hidden = !s.size || sizing
    if (s.size) {
      size.textContent = `${s.size.w} × ${s.size.h}`
      const over = s.size.w > s.maxFit.w || s.size.h > s.maxFit.h
      size.classList.toggle('over', over)
      size.title = over
        ? `Exceeds this display (${s.maxFit.w} × ${s.maxFit.h}) — a screen recording will clip it`
        : 'Change size'
    }

    fitBar()
  }

  // Zap counts what's gone from the page and lights while the page is inert.
  function renderZap (s) {
    const well = $('zapWell')
    well.hidden = !s.target
    if (well.hidden) return
    const z = s.zaps || { count: 0, zapping: false }
    const btn = $('zapBtn')
    btn.textContent = z.zapping
      ? (z.count ? `Zapping · ${z.count}` : 'Zapping')
      : (z.count ? `${z.count} zapped` : 'Zap')
    btn.classList.toggle('on', !!z.zapping)
    btn.title = z.zapping
      ? 'Click an element to hide it · ⌥-click removes it from the layout · ⌘Z takes the last one back · esc or click here when you\'re done'
      : 'Click elements on the page to keep them out of the take · right-click to restore'
  }

  // The record button: a clock while a take runs, the outcome for a moment
  // after, otherwise the word.
  let clock = null
  function renderRecord (s) {
    clearInterval(clock)
    const g = $('record')
    g.hidden = !s.target
    if (g.hidden) return
    const r = s.recording
    const word = recBtn.querySelector('.word')
    recBtn.classList.toggle('on', !!r && r.phase === 'recording')
    recBtn.classList.toggle('done', !!r && r.phase !== 'recording')
    if (r && r.phase === 'recording') {
      const tick = () => {
        const t = Math.floor((Date.now() - r.since) / 1000)
        word.textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`
      }
      tick()
      clock = setInterval(tick, 250)
      recBtn.title = 'Stop recording'
    } else if (r && r.phase === 'saved') {
      word.textContent = 'Saved'
      recBtn.title = r.detail
    } else if (r && r.phase === 'failed') {
      const needs = s.recordPermission !== 'granted'
      word.textContent = needs ? 'Allow recording ↗' : 'Couldn’t record'
      recBtn.title = needs ? 'blank needs Screen Recording permission · click to open System Settings' : r.detail
    } else {
      word.textContent = 'Record'
      recBtn.title = isArmed() ? 'Record a take: scroll to the end, then stop and save' : 'Record the page until pressed again'
    }
  }

  // The window grows to fit whatever is open and shrinks back when it
  // folds. Widths are summed from the controls, with room kept for the
  // address, since the bar itself always fills the window it's given.
  const FIELD_MIN = 220
  let fitted = 0
  function fitBar () {
    const cs = getComputedStyle(barEl)
    let want = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + FIELD_MIN
    let n = 1
    for (const el of barEl.children) {
      if (el.classList.contains('field') || el.offsetParent === null) continue
      want += el.getBoundingClientRect().width
      n++
    }
    want = Math.ceil(want + parseFloat(cs.columnGap) * (n - 1)) + 2
    if (want !== fitted) { fitted = want; stage.setBarWidth(want) }
  }

  // The selected mode is the filled pill; the well shows play, and the
  // presets well beside it, only while a mode is selected. While the page
  // moves, play is the stop and carries the readout: a countdown through
  // the pre-roll, then the direction, or paused.
  let countdown = null
  function renderScroll (s) {
    const st = s.scrolling
    const sc = s.scroll
    clearInterval(countdown)
    scroll.hidden = !s.features.scroll || !s.target || !sc
    presets.hidden = true
    if (scroll.hidden) { $('pinsWell').hidden = true; return }

    const open = isArmed()
    // Pin with nothing pinned has no take in it: no play, and Record is a
    // plain recording rather than a whole take.
    const ready = sc.mode !== 'pin' || !!(s.pins && s.pins.count)
    stage.armed(open && ready)
    const live = !!(st && st.active)
    for (const b of modeBtns) b.classList.toggle('on', open && b.dataset.mode === sc.mode)
    play.hidden = !open || !ready
    play.classList.toggle('live', live)

    const custom = open && (sc.preset === 'Custom' || numbersFor === s.target.id)
    if (open && s.scrollPresets) {
      presets.hidden = false
      const names = s.scrollPresets[sc.mode] || []
      const want = names.join('|') + '|' + sc.mode
      if (presets.dataset.for !== want) {
        presets.dataset.for = want
        presets.replaceChildren(...names.map(n => {
          const b = document.createElement('button')
          b.className = 'btn'
          b.textContent = n
          b.onclick = () => { numbersFor = null; stage.scrollPreset(n); back() }
          return b
        }), (() => {
          const b = document.createElement('button')
          b.className = 'btn'
          b.textContent = 'Custom'
          b.title = 'The numbers behind the presets'
          b.onclick = () => { numbersFor = s.target.id; render(state) }
          return b
        })())
      }
      for (const b of presets.children) {
        b.classList.toggle('on', b.textContent === 'Custom' ? custom : (!custom && b.textContent === sc.preset))
      }
    }
    renderPins(s, open && sc.mode === 'pin')
    numbers.hidden = !custom
    if (custom) {
      const keys = BY_MODE[sc.mode] || BY_MODE.steady
      for (const [key, n] of Object.entries(nums)) {
        n.field.closest('.num').hidden = !keys.includes(key)
        n.sync()
      }
    }

    const status = $('scrollStatus')
    status.textContent = ''
    if (!live) return
    const arrow = st.dir < 0 ? '↑' : '↓'
    if (st.phase === 'preroll') {
      const tickDown = () => {
        const left = Math.max(0, st.until - Date.now())
        status.textContent = `${arrow} in ${(left / 1000).toFixed(1)} s`
      }
      tickDown()
      countdown = setInterval(tickDown, 100)
    } else if (st.phase === 'paused') {
      status.textContent = `${arrow} paused`
    } else {
      status.textContent = arrow
    }
  }

  // Pins belongs to Pin: it shows with that mode's presets and counts what the
  // page holds. Armed, the pill is lit, because the page underneath it has
  // stopped taking clicks and that shouldn't be a surprise.
  function renderPins (s, show) {
    const well = $('pinsWell')
    const btn = $('pinsBtn')
    well.hidden = !show
    if (!show) {
      // The pill is the only way back out of pinning, so it can't go away
      // while the page underneath is still inert.
      if (s.pins && s.pins.pinning) stage.pins('off')
      return
    }
    const m = s.pins || { count: 0, pinning: false }
    $('pinsClear').hidden = !m.count
    btn.textContent = m.pinning
      ? (m.count ? `Pinning · ${m.count}` : 'Pinning')
      : (m.count ? (m.count === 1 ? '1 pin' : `${m.count} pins`) : 'Pins')
    btn.classList.toggle('on', !!m.pinning)
    btn.title = m.pinning
      ? 'Click a spot to pin it, a pin to take it away · click here when you\'re done'
      : 'Click spots on the page to pin where a take rests · right-click to clear'
  }
</script>
