<!doctype html>
<meta charset="utf-8">
<title>Stage</title>
<style>
  :root {
    --font:-apple-system, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    --ink:#141412; --dim:#7d7970; --faint:#a9a49a; --paper:#f4f2ed; --rule:#dcd8ce;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  html { scrollbar-width:none; }
  ::-webkit-scrollbar { width:0; height:0; }
  body {
    background:var(--paper); color:var(--ink);
    font:13px/1.5 var(--font);
    display:grid; place-items:center; -webkit-user-select:none; user-select:none;
  }
  .wrap { width:min(440px, 76vw); }

  h1 { font-size:14px; font-weight:600; margin:0 0 2px; letter-spacing:-0.01em; }
  .sub { margin:0 0 20px; color:var(--dim); font-size:12px; }

  .drop {
    border:1px dashed var(--rule); border-radius:12px; padding:32px 20px;
    text-align:center; color:var(--dim); font-size:12.5px; background:#fbfaf7;
    transition:border-color .12s, background .12s, color .12s; cursor:pointer;
  }
  .drop:hover { border-color:var(--faint); }
  .drop.hot { border-color:var(--ink); border-style:solid; background:#fff; color:var(--ink); }
  .drop b { font-weight:600; color:var(--ink); }
  .drop small { display:block; margin-top:7px; font-size:11px; color:var(--faint); }

  .recents { margin-top:22px; }
  .recents p { font-size:10px; text-transform:uppercase; letter-spacing:.07em;
               color:var(--faint); margin:0 0 5px; font-weight:600; }
  .rec { all:unset; display:flex; align-items:center; gap:8px; width:100%;
         padding:6px 8px; border-radius:6px; cursor:pointer; font-size:12px; }
  .rec:hover { background:#fff; }
</style>

<div class="wrap">
  <h1>Stage</h1>
  <p class="sub">Point it at one thing and it shows it cleanly.</p>

  <div class="drop" id="drop">
    Drop an <b>HTML file</b> or a <b>project folder</b>
    <small>or type a URL in the bar below · ⌘K</small>
  </div>

  <div class="recents" id="recents" hidden>
    <p>Recent</p>
    <div id="recList"></div>
  </div>
</div>

<script>
  const drop = document.getElementById('drop')
  drop.onclick = () => stage.pick()

  const stop = (e) => { e.preventDefault(); e.stopPropagation() }
  document.addEventListener('dragover',  (e) => { stop(e); drop.classList.add('hot') })
  document.addEventListener('dragleave', (e) => { stop(e); drop.classList.remove('hot') })
  document.addEventListener('drop', (e) => {
    stop(e)
    drop.classList.remove('hot')
    const f = e.dataTransfer.files[0]
    if (!f) return
    const p = stage.pathForFile(f)   // Electron 32+ removed File.path
    if (p) stage.openPath(p)
  })

  stage.onState((s) => {
    const list = document.getElementById('recList')
    const box = document.getElementById('recents')
    if (!s.recents || !s.recents.length) { box.hidden = true; return }
    box.hidden = false
    list.innerHTML = ''
    for (const r of s.recents) {
      const b = document.createElement('button')
      b.className = 'rec'
      b.textContent = r.name
      b.onclick = () => stage.openRecent(r.id)
      list.appendChild(b)
    }
  })
</script>
